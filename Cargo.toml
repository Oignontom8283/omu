[package]
name = "omu"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
description = "Audio routing daemon with a node-graph: capture an application's sound, process it, send it to a virtual microphone"
repository = "https://github.com/Oignontom8283/omu"
license-file = "LICENSE"
publish = false
default-run = "omud"

# One library holds every component (modules = folders of src/); each binary is a thin entry point. One package, three
# targets:
#
#   omud   the daemon: owns the audio engine, serves the control protocol  (feature `daemon`, default)
#   omu-cli      the command-line client of the daemon                           (feature `cli`, default)
#   omu-gui      the desktop window (Tauri)                                      (feature `gui`, opt-in)
#
# `gui` is opt-in only because it pulls Tauri, which takes a while to compile; everything else is the same package:
# `cargo build --features gui`, `cargo run --bin omu-gui --features gui`, `cargo install --path . --bin omu-cli`.
[lib]
name = "omu"
path = "src/lib.rs"

[[bin]]
name = "omud"
path = "src/bin/omud/main.rs"
required-features = ["daemon"]

[[bin]]
name = "omu-cli"
path = "src/bin/omu-cli/main.rs"
required-features = ["cli"]

[[bin]]
name = "omu-gui"
path = "src/bin/omu-gui/main.rs"
required-features = ["gui"]

[features]
default = ["daemon", "cli"]
# the audio engine and the platform backends (heavy: real-time code, Windows API bindings)
engine = ["dep:rtrb", "dep:windows", "dep:windows-core", "dep:nnnoiseless", "dep:symphonia"]
# the daemon: control server (HTTP + WebSocket) and the embedded web panel
daemon = ["engine", "logging", "dep:tokio", "dep:axum", "dep:futures-util", "dep:rust-embed", "dep:getrandom", "dep:clap"]
# logs (file, console, in-memory ring) and the Windows crash handlers; without it only the panic hook and the macros exist
logging = ["dep:tracing-subscriber", "dep:tracing-appender", "dep:windows"]
# the command-line client
cli = ["client", "dep:clap"]
# what any client needs to talk to a daemon (the CLI, a Tauri window): protocol + HTTP client
client = ["dep:ureq"]
# the desktop window: the panel embedded in a Tauri window that talks to the daemon through the client. `custom-protocol`
# is Tauri's own switch for "serve the panel from inside the executable" (without it the window would load a
# development server's address and stay blank).
gui = ["client", "logging", "dep:tauri", "dep:tauri-build", "tauri/custom-protocol"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "fmt", "env-filter", "registry", "tracing-log", "ansi"] }
tracing-appender = { version = "0.2", optional = true }
rtrb = { version = "0.4", optional = true }
# Noise reduction: RNNoise (Xiph.Org, BSD-3-Clause) rewritten in pure Rust, model included: nothing to download or link
nnnoiseless = { version = "0.5", optional = true, default-features = false }
# Reads the sound files people import into a soundboard (MP3, WAV, FLAC, OGG Vorbis): pure Rust, MPL-2.0
symphonia = { version = "0.6", optional = true, default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm"] }
dirs = "7.0"
tokio = { version = "1.54", optional = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", optional = true, features = ["ws"] }
futures-util = { version = "0.3", optional = true }
rust-embed = { version = "8.14", optional = true, features = ["mime-guess"] }
getrandom = { version = "0.4", optional = true }
clap = { version = "4.6", optional = true, features = ["derive", "env"] }
ureq = { version = "3.5", optional = true, default-features = false, features = ["json"] }
tauri = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { version = "0.62", optional = true }

[dev-dependencies]
tungstenite = "0.30"

[build-dependencies]
toml = "1.2"
tauri-build = { version = "2", optional = true }

# Release builds, as optimised as the language allows without tying the result to one machine:
#  * fat link-time optimisation across every crate + one code-generation unit: the best inlining and dead-code
#    removal (each executable keeps only what it uses: the CLI carries no audio engine, no server);
#  * opt-level 3;
#  * `panic = "unwind"` is kept on purpose: the audio thread contains a panicking block (catch_unwind) and the crash
#    handler runs the cleanups while unwinding; `abort` would turn every bug into a dead program;
#  * line tables are kept in the debug information (`.pdb` next to the executable on Windows) and symbols are not
#    stripped: crash reports then show function, file and line. The debug information is not loaded at run time, so
#    it costs disk space beside the executable, not speed or memory. Ship the `.pdb` files with the executables.
# `-C target-cpu=native` is NOT set: it would make binaries that crash with an illegal instruction on older CPUs.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
strip = "none"
incremental = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

# This repository is its own workspace root (the folder above it holds unrelated material).
[workspace]
