# The workspace: one small crate per folder of src/ (components) and one per executable in src/bin/. A component lists in its
# own Cargo.toml what it needs, so building an executable compiles only the components it uses.
[workspace]
members = [
    "src/branding",
    "src/types",
    "src/diagnostics",
    "src/discovery",
    "src/dsp",
    "src/audiofile",
    "src/protocol",
    "src/graph",
    "src/hal",
    "src/logging",
    "src/desktop",
    "src/deepfilter",
    "src/net",
    "src/tls",
    "src/modules",
    "src/virtual_devices",
    "src/soundboard",
    "src/engine",
    "src/client",
    "src/daemon",
    "src/cli",
    "src/gui",
    "src/build",
    "src/bin/omud",
    "src/bin/omu-cli",
    "src/bin/omu-gui",
    "scripts/win-installer",
]
resolver = "2"

# The version of every program and component: one number, the one of the release (the CI refuses a release whose tag is another).
# It is raised here, before the tag is made.
[workspace.package]
version = "0.35.0"

# Release builds, as optimised as the language allows without tying the result to one machine:
#  * fat link-time optimisation across every crate + one code-generation unit: the best inlining and dead-code
#    removal (each executable keeps only what it uses: the CLI carries no audio engine, no server);
#  * opt-level 3;
#  * `panic = "unwind"` is kept on purpose: the audio thread contains a panicking block (catch_unwind) and the crash
#    handler runs the cleanups while unwinding; `abort` would turn every bug into a dead program;
#  * line tables are kept in the debug information (`.pdb` next to the executable on Windows) and symbols are not
#    stripped: crash reports then show function, file and line. The debug information is not loaded at run time, so
#    it costs disk space beside the executable, not speed or memory. Ship the `.pdb` files with the executables.
# `-C target-cpu=native` is NOT set: it would make binaries that crash with an illegal instruction on older CPUs.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = "line-tables-only"
strip = "none"
incremental = false

# The code that runs the DeepFilterNet model is far too slow to keep up with sound when it is not optimised, and tract's
# internal checks (which fail on this model) only exist with debug assertions: build these packages optimised and without
# them even in debug builds. Release builds are unaffected.
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.deep_filter]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.ndarray]
opt-level = 3
