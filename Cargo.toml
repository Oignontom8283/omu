[package]
name = "omu"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Audio routing daemon with a node-graph: capture an application's sound, process it, send it to a virtual microphone"
repository = "https://github.com/Oignontom8283/omu"
license-file = "LICENSE"
publish = false

# One library holds every component (modules = folders of src/); each binary is a thin entry point:
#
#   omud   the daemon: owns the audio engine, serves the control protocol        (feature `daemon`)
#   omu    the command-line client of the daemon                                 (feature `cli`)
#   ui     (to come) the Tauri window, a separate crate that depends on this library with
#          `default-features = false, features = ["client"]`: like `omu`, it only needs the protocol and the client.
[lib]
name = "omu"
path = "src/lib.rs"

[[bin]]
name = "omud"
path = "src/bin/omud/main.rs"
required-features = ["daemon"]

[[bin]]
name = "omu"
path = "src/bin/omu/main.rs"
required-features = ["cli"]

[features]
default = ["daemon", "cli"]
# the audio engine and the platform backends (heavy: real-time code, Windows API bindings)
engine = ["dep:rtrb", "dep:windows", "dep:windows-core"]
# the daemon: control server (HTTP + WebSocket) and the embedded web panel
daemon = ["engine", "dep:tokio", "dep:axum", "dep:futures-util", "dep:rust-embed", "dep:getrandom", "dep:clap"]
# the command-line client
cli = ["client", "dep:clap"]
# what any client needs to talk to a daemon (the CLI, a Tauri window): protocol + HTTP client
client = ["dep:ureq"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rtrb = { version = "0.4", optional = true }
dirs = "7.0"
tokio = { version = "1.54", optional = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
axum = { version = "0.8", optional = true, features = ["ws"] }
futures-util = { version = "0.3", optional = true }
rust-embed = { version = "8.14", optional = true, features = ["mime-guess"] }
getrandom = { version = "0.4", optional = true }
clap = { version = "4.6", optional = true, features = ["derive", "env"] }
ureq = { version = "3.5", optional = true, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = { version = "0.62", optional = true }

[dev-dependencies]
tungstenite = "0.30"

[build-dependencies]
toml = "1.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

# This repository is its own workspace root; the desktop window is a member (it needs no audio code).
[workspace]
members = ["ui/src-tauri"]
