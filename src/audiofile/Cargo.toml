[package]
name = "omu-audiofile"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "files that hold sound: WAV, compressed storage, and importing MP3, FLAC, OGG, AAC and videos"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
omu-dsp = { path = "../dsp" }
omu-types = { path = "../types" }
claxon = "0.4"
flacenc = { version = "0.5", default-features = false }
symphonia = { version = "0.6", default-features = false, features = ["mp3", "flac", "ogg", "vorbis", "wav", "pcm", "mkv", "isomp4", "aac"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
