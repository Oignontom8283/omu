[package]
name = "app-omud"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "the omud executable"
license-file = "../../../LICENSE"
publish = false

[[bin]]
name = "omud"
path = "main.rs"
# no unit tests: do not build a second, test copy of the whole program
test = false

[features]
default = ["tray", "web-panel", "deepfilter"]
tray = ["omu-daemon/tray"]
web-panel = ["omu-daemon/web-panel"]
deepfilter = ["omu-daemon/deepfilter"]

[dependencies]
omu-branding = { path = "../../branding" }
omu-daemon = { path = "../../daemon", default-features = false }
omu-desktop = { path = "../../desktop" }
omu-diagnostics = { path = "../../diagnostics" }
omu-logging = { path = "../../logging" }
omu-discovery = { path = "../../discovery" }
omu-types = { path = "../../types" }
omu-virtual-devices = { path = "../../virtual_devices" }
tracing = "0.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
clap = { version = "4.6", features = ["derive", "env"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
omu-client = { path = "../../client" }
omu-protocol = { path = "../../protocol" }
tungstenite = "0.30"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
