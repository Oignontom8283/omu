[package]
name = "omu-diagnostics"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "logs, crash reports and a clean exit when things go wrong"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[features]
logging = ["dep:tracing-subscriber", "dep:tracing-appender", "dep:windows"]

[dependencies]
omu-branding = { path = "../branding" }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "fmt", "env-filter", "registry", "tracing-log", "ansi"] }
tracing-appender = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { optional = true, version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
