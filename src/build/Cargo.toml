[package]
name = "omu-build"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "helpers for the build scripts: the web panel build and the window configuration"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"
# no unit tests: nothing to build as a test program
test = false

[dependencies]
toml = "1.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
