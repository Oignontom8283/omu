[package]
name = "omu-client"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "a client of the daemon's control protocol over HTTP"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
omu-branding = { path = "../branding" }
omu-discovery = { path = "../discovery" }
omu-protocol = { path = "../protocol" }
serde_json = "1.0"
ureq = { version = "3.5", default-features = false, features = ["json"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
