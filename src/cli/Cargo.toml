[package]
name = "omu-cli"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "the command-line client"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
omu-branding = { path = "../branding" }
omu-client = { path = "../client" }
omu-protocol = { path = "../protocol" }
omu-types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }

[dev-dependencies]
omu-daemon = { path = "../daemon" }
omu-graph = { path = "../graph" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
