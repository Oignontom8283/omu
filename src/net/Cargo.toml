[package]
name = "omu-net"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "sound over the network: VBAN, and WebRTC (WHIP and WHEP)"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# WebRTC without input/output of its own (the sockets and the clock are ours), with the crypto written in Rust: nothing to install
str0m = { version = "0.25", default-features = false, features = ["rust-crypto"] }
# Opus, the codec of WebRTC audio: libopus translated to Rust, so no C compiler or cmake is needed
unsafe-libopus = "0.2"
if-addrs = "0.13"
thiserror = "2.0"
omu-diagnostics = { path = "../diagnostics" }
omu-dsp = { path = "../dsp" }
omu-hal = { path = "../hal" }
omu-types = { path = "../types" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
