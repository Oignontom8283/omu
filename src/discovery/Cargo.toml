[package]
name = "omu-discovery"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "how clients find the local daemon: its address and token in the data folder"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
omu-branding = { path = "../branding" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
