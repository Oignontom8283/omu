[package]
name = "omu-modules"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "optional modules (FFmpeg, the DeepFilterNet model) and their downloads"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[features]
deepfilter = []

[dependencies]
omu-audiofile = { path = "../audiofile" }
omu-diagnostics = { path = "../diagnostics" }
omu-discovery = { path = "../discovery" }
omu-tls = { path = "../tls" }
omu-types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
ureq = { version = "3.5", default-features = false, features = ["json", "rustls", "platform-verifier"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
