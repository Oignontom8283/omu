[package]
name = "omu-types"
version.workspace = true
edition = "2021"
rust-version = "1.88"
description = "the data types shared by every part of the program: graph, blocks, devices, soundboards, settings"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# mathematical expressions typed in a block (a + b, c * log(a), a = b)
fasteval = "0.2"
# the tests of texts: a == b, a.contains(b), a.matches("^x[0-9]+$")
cel = { version = "0.16", default-features = false, features = ["regex"] }
omu-branding = { path = "../branding" }
serde = { version = "1.0", features = ["derive"] }
subst = { version = "0.3", default-features = false }

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
