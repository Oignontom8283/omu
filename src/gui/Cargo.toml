[package]
name = "omu-gui"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "the desktop window (Tauri)"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
omu-branding = { path = "../branding" }
omu-client = { path = "../client" }
omu-diagnostics = { path = "../diagnostics" }
omu-discovery = { path = "../discovery" }
omu-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tauri = { version = "2", features = ["custom-protocol"] }
rfd = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_Media",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Kernel",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
omu-daemon = { path = "../daemon" }

[build-dependencies]
omu-build = { path = "../build" }
tauri-build = "2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
