[package]
name = "omu-soundboard"
version = "0.22.1"
edition = "2021"
rust-version = "1.88"
description = "soundboards: boards, pads, the sound library, memory and voices"
license-file = "../../LICENSE"
publish = false

[lib]
path = "lib.rs"

[dependencies]
omu-audiofile = { path = "../audiofile" }
omu-branding = { path = "../branding" }
omu-dsp = { path = "../dsp" }
omu-hal = { path = "../hal" }
omu-modules = { path = "../modules" }
omu-types = { path = "../types" }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
